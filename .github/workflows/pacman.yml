name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: generate pacman-contribution-graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # 如果 README 指定可用的輸入名稱 (e.g. output_file or output)，可加入：
          # output: "dist/pacman-contribution-graph.svg"
      
      # 可保留短期 debug（成功時可移除）
      - name: debug workspace after generation
        run: |
          echo "Listing top-level:"
          ls -la
          echo "Find SVGs (excluding .git):"
          find . -type f -name '*.svg' -not -path './.git/*' -ls || true
      
      # 將所有找到的 svg 移入 dist（更寬鬆）
      - name: prepare dist directory and move generated SVGs
        run: |
          set -euo pipefail
          mkdir -p dist
          found=$(find . -type f -name '*.svg' -not -path './.git/*' -print -quit || true)
          if [ -z "$found" ]; then
            echo "No SVG found. Creating placeholder to avoid failure."
            echo "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><rect width='16' height='16' fill='#ccc'/></svg>" > dist/placeholder.svg
          else
            find . -type f -name '*.svg' -not -path './.git/*' -exec mv {} dist/ \;
            echo "Moved generated SVG(s) to dist/"
            ls -la dist
          fi
      
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
